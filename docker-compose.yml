  #   command:
  #     - --config
  #     - /etc/vector/vector.yaml
  #     - --watch-enrichment-tables
  #   volumes:
  #     - rule-data:/data:ro
  #     - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
  #   ports:
  #     - "514:514/udp"

volumes:
  rule-data:
