services:
  opnsense-rule-scraper:
    build: .
    container_name: opnsense-rule-scraper
    restart: unless-stopped
    env_file: .env
    environment:
      OUTPUT_DIR: /data
      HTTP_PORT: "8080"
    volumes:
      - rule-data:/data
    ports:
      - "8080:8080"

  # Example: Vector reads the shared CSV and ships enriched filterlog to Loki.
  # Uncomment and point OPNsense syslog at vector:514.
  # vector:
